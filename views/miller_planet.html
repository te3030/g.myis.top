<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">

    <title>星际穿越 · 米勒星球时间</title>
    <style>
        /* ----- 通用重置与主题 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #b7b7c9;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-pack: center;
            justify-content: center;
            -ms-flex-align: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 星空画布 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 主容器（兼容 IE 透明度） */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 20, 0.75);
            /* IE 降级 */
            background: #0a0a20;
            /* 使用 IE 支持的 filter 做半透明 */
            filter: progid:DXImageTransform.Microsoft.Alpha(Opacity=75);
            padding: 2.5rem 3.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(100, 130, 255, 0.25);
            box-shadow: 0 0 60px rgba(40, 80, 200, 0.2), inset 0 0 60px rgba(40, 80, 200, 0.05);
            text-align: center;
            max-width: 880px;
            width: 92%;
        }
        /* 现代浏览器保留 backdrop-filter */
        @supports (backdrop-filter: blur(4px)) {
            .container {
                background: rgba(10, 10, 20, 0.75);
                backdrop-filter: blur(4px);
                filter: none;
            }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #d0d8ff;
            text-shadow: 0 0 20px #3a6eff, 0 0 60px #1a3faa;
            margin-bottom: 0.2rem;
        }
        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 3px;
            color: #8899dd;
            margin-bottom: 2.2rem;
            border-bottom: 1px solid rgba(100, 130, 255, 0.2);
            padding-bottom: 0.8rem;
        }

        .clock-grid {
            display: -ms-flexbox;
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            gap: 1.8rem;
        }

        .clock-block {
            background: rgba(0, 0, 0, 0.4);
            /* IE 降级 */
            background: #0a0a14;
            border-radius: 1.2rem;
            padding: 1.2rem 1.5rem;
            border-left: 3px solid #3a6eff;
            box-shadow: 0 0 30px rgba(0, 20, 80, 0.3);
        }
        .clock-block.miller {
            border-left-color: #ff7a3a;
        }

        .clock-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #7a8bc7;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-pack: justify;
            justify-content: space-between;
            -ms-flex-align: center;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .clock-label .badge {
            font-size: 0.65rem;
            background: #1a2a5a;
            padding: 0.15rem 0.8rem;
            border-radius: 20px;
            color: #aac0ff;
            letter-spacing: 1px;
        }

        .time-display {
            display: -ms-flexbox;
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            -ms-flex-align: center;
            align-items: center;
            gap: 0.2rem;
        }
        .date-line {
            font-size: 1.2rem;
            font-weight: 300;
            color: #9aabdf;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(60, 120, 255, 0.2);
        }
        .time-line {
            font-size: 2.6rem;
            font-weight: 400;
            font-family: 'Courier New', monospace;
            color: #e4ecff;
            text-shadow: 0 0 15px rgba(60, 120, 255, 0.4);
            letter-spacing: 2px;
            word-break: break-all;
        }
        .time-line .nanoseconds {
            font-size: 1.4rem;
            color: #6a8adf;
            margin-left: 0.2rem;
        }

        .info-row {
            display: -ms-flexbox;
            display: flex;
            -ms-flex-pack: justify;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6a7aa0;
            margin-top: 0.4rem;
            letter-spacing: 1px;
        }

        .dilation-factor {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px dashed rgba(100, 130, 255, 0.2);
            font-size: 0.85rem;
            color: #7a8bc7;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-pack: center;
            justify-content: center;
            -ms-flex-wrap: wrap;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .dilation-factor span {
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(100, 130, 255, 0.15);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #4a5a7a;
            letter-spacing: 2px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
            .time-line { font-size: 1.8rem; }
            .time-line .nanoseconds { font-size: 1rem; }
            .date-line { font-size: 0.9rem; }
            .clock-block { padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="container">
        <h1>✦ 米勒星球 ✦</h1>
        <div class="subtitle">—— 时间膨胀 · 1小时 = 7地球年 ——</div>

        <div class="clock-grid">
            <!-- 地球本地时间 -->
            <div class="clock-block">
                <div class="clock-label">
                    <span>🌍 地球 · 本地时间</span>
                    <span class="badge" id="earthTimezone">UTC+0</span>
                </div>
                <div class="time-display">
                    <div class="date-line" id="earthDate">---- -- --</div>
                    <div class="time-line" id="earthTime">--:--:--.---------</div>
                </div>
                <div class="info-row">
                    <span>自基准流逝</span>
                    <span id="earthElapsed">0 秒</span>
                </div>
            </div>

            <!-- 米勒星球时间 -->
            <div class="clock-block miller">
                <div class="clock-label">
                    <span>⏳ 米勒星球 · UTC</span>
                    <span class="badge">时间膨胀 61,360.6896×</span>
                </div>
                <div class="time-display">
                    <div class="date-line" id="millerDate">---- -- --</div>
                    <div class="time-line" id="millerTime">--:--:--.---------</div>
                </div>
                <div class="info-row">
                    <span>自基准（2014-11-05 00:00:00 UTC）</span>
                    <span id="millerElapsed">0 秒</span>
                </div>
            </div>
        </div>

        <div class="dilation-factor">
            <span>⏱ 1 米勒小时 = 7 地球年</span>
            <span>📐 换算比 1 : 61,360.6896</span>
        </div>
        <div class="footer">✦ 时间精度：纳秒 (ns) ✦ 数据实时更新</div>
    </div>

    <script>
        /* ============================================================
           兼容性说明：
           - 使用 ES5 语法（var, function, 字符串拼接）
           - 所有现代 API 均做特性检测，降级回退
           - 支持 IE11+、Edge、Chrome、Firefox、Safari 等
           ============================================================ */

        (function() {
            // ---------- 常数 ----------
            // 参考点：2014-11-05 00:00:00 UTC (毫秒)
            var REF_DATE_UTC = Date.UTC(2014, 10, 5, 0, 0, 0, 0);
            // 时间膨胀因子：1 米勒秒 = 61360.6896 地球秒
            var DILATION = 7 * 365.2422 * 24; // = 61360.6896

            // ---------- DOM 引用 ----------
            var earthDate = document.getElementById('earthDate');
            var earthTime = document.getElementById('earthTime');
            var millerDate = document.getElementById('millerDate');
            var millerTime = document.getElementById('millerTime');
            var earthElapsed = document.getElementById('earthElapsed');
            var millerElapsed = document.getElementById('millerElapsed');
            var earthTimezone = document.getElementById('earthTimezone');

            // 显示本地时区偏移
            var offset = -new Date().getTimezoneOffset() / 60;
            var offsetStr = (offset >= 0 ? '+' : '') + offset + 'h';
            earthTimezone.textContent = 'UTC' + offsetStr;

            // ---------- 高精度时间获取（兼容） ----------
            // 返回当前时间戳（毫秒，可带小数），基于 UTC
            function getHighResTimestamp() {
                var now = 0;
                // 优先使用 performance.now() + performance.timeOrigin
                if (window.performance && typeof window.performance.now === 'function') {
                    var perfNow = window.performance.now();
                    // 尝试获取 timeOrigin
                    if (window.performance.timeOrigin !== undefined) {
                        now = window.performance.timeOrigin + perfNow;
                    } else if (window.performance.timing && window.performance.timing.navigationStart) {
                        // 降级：使用 navigationStart
                        now = window.performance.timing.navigationStart + perfNow;
                    } else {
                        // 最差降级：用 Date.now()（精度仅毫秒）
                        now = Date.now();
                    }
                } else {
                    now = Date.now();
                }
                return now;
            }

            // ---------- 工具函数 ----------
            function pad2(num) {
                return num < 10 ? '0' + num : '' + num;
            }

            function pad9(num) {
                var str = '' + Math.floor(num);
                while (str.length < 9) str = '0' + str;
                return str;
            }

            // 格式化日期 (YYYY-MM-DD)
            function formatDate(dateObj) {
                var y = dateObj.getFullYear();
                var m = pad2(dateObj.getMonth() + 1);
                var d = pad2(dateObj.getDate());
                return y + '-' + m + '-' + d;
            }

            // 格式化时间 (HH:MM:SS.nnnnnnnnn)
            function formatTime(dateObj, fractionalSeconds) {
                var h = pad2(dateObj.getHours());
                var min = pad2(dateObj.getMinutes());
                var sec = pad2(dateObj.getSeconds());
                var ns = Math.floor((fractionalSeconds % 1) * 1e9);
                if (ns < 0) ns += 1e9;
                var nsStr = pad9(ns);
                return h + ':' + min + ':' + sec + '.' + nsStr;
            }

            // 格式化流逝时间 (秒) 为 天、时、分、秒
            function formatElapsed(seconds) {
                if (seconds < 0) return '-' + formatElapsed(-seconds);
                var days = Math.floor(seconds / 86400);
                var hours = Math.floor((seconds % 86400) / 3600);
                var mins = Math.floor((seconds % 3600) / 60);
                var secs = Math.floor(seconds % 60);
                var frac = seconds - Math.floor(seconds);
                var ms = Math.floor(frac * 1000);
                var parts = [];
                if (days > 0) parts.push(days + 'd');
                if (hours > 0 || days > 0) parts.push(hours + 'h');
                if (mins > 0 || hours > 0 || days > 0) parts.push(mins + 'm');
                parts.push(secs + 's');
                if (ms > 0) parts.push(ms + 'ms');
                return parts.join(' ');
            }

            // ---------- 核心更新函数 ----------
            function updateClocks() {
                var nowMs = getHighResTimestamp(); // 毫秒（可能小数）
                var nowSeconds = nowMs / 1000;

                // 地球经过的秒数
                var earthElapsedSeconds = nowSeconds - (REF_DATE_UTC / 1000);

                // 米勒经过的秒数
                var millerElapsedSeconds = earthElapsedSeconds / DILATION;

                // ---- 更新地球本地时间 ----
                var localDate = new Date(nowMs);
                var fracEarth = nowSeconds - Math.floor(nowSeconds);
                earthDate.textContent = formatDate(localDate);
                earthTime.textContent = formatTime(localDate, fracEarth);
                earthElapsed.textContent = formatElapsed(earthElapsedSeconds);

                // ---- 更新米勒时间 (UTC) ----
                var millerTimestamp = (REF_DATE_UTC / 1000) + millerElapsedSeconds;
                var millerDateObj = new Date(millerTimestamp * 1000);
                var fracMiller = millerElapsedSeconds - Math.floor(millerElapsedSeconds);
                millerDate.textContent = formatDate(millerDateObj);
                millerTime.textContent = formatTime(millerDateObj, fracMiller);
                millerElapsed.textContent = formatElapsed(millerElapsedSeconds);
            }

            // ---------- 启动定时器（兼容 setInterval） ----------
            // 使用 setInterval 每 50ms 刷新一次，保持更新
            setInterval(updateClocks, 50);

            // 立即执行一次
            updateClocks();

            // ---------- 星空背景（Canvas，兼容 IE9+） ----------
            var canvas = document.getElementById('starfield');
            var ctx = canvas.getContext('2d');
            var stars = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                generateStars();
            }

            function generateStars() {
                stars = [];
                var count = Math.floor((canvas.width * canvas.height) / 1200);
                for (var i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.5 + 0.5,
                        brightness: Math.random() * 0.6 + 0.4,
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars(time) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // 渐变背景（兼容）
                var grad = ctx.createRadialGradient(
                    canvas.width * 0.5, canvas.height * 0.4, 100,
                    canvas.width * 0.5, canvas.height * 0.4, canvas.width * 0.8
                );
                grad.addColorStop(0, '#0a0a20');
                grad.addColorStop(1, '#000005');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < stars.length; i++) {
                    var star = stars[i];
                    var bright = star.brightness * (0.7 + 0.3 * Math.sin(time * star.twinkleSpeed + star.phase));
                    var alpha = Math.min(1, bright * 1.2);
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(220, 230, 255, ' + alpha + ')';
                    ctx.fill();
                    if (star.radius > 1.2) {
                        ctx.shadowColor = 'rgba(150, 200, 255, 0.1)';
                        ctx.shadowBlur = 8;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
            }

            function animateStars(time) {
                drawStars(time);
                requestAnimationFrame(animateStars);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(animateStars);
        })();
    </script>
</body>
</html>
